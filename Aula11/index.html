<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Links de música</title>
    <style>
        
        body {
             background-color: #ece6e6;
            text-align: center;
        }

        a {
            color: blue;
        }
        a:hover {
            color: rgb(255, 0, 0);
        }
        a:active {
            color: green;
        }

        a::before {
            content: '✳ ';
        }
        a::after {
            content: ' ✳';
        }

        .divtratada {
            display: inline-block;
            vertical-align: top;
            width: 250px;
            padding: 15px;
            margin: 10px;
            border: 2px solid black;
        }

        #divspotify {
            background-color: lightgreen;
        }
        #divyoutube {
            background-color: rgb(255, 25, 0);
        }
        #divamazon {
            background-color: rgb(0, 230, 230);
        }

        .logo {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <h1>Meus links de música</h1>

    <div id="divspotify" class="divtratada">
        <h2>Spotify</h2>
        <img class="logo" src="img/spotify.png" alt="Logo do Spotify">
        <p><a href="https://open.spotify.com" target="_blank">♬ Spotify</a></p>
    </div>

    <div id="divyoutube" class="divtratada">
        <h2>YouTube</h2>
        <img class="logo" src="img/youtube.png" alt="Logo do YouTube">
        <p><a href="https://www.youtube.com" target="_blank">♬ YouTube</a></p>
    </div>

    <div id="divamazon" class="divtratada">
        <h2>Amazon Music</h2>
        <img class="logo" src="img/amazon-music.png" alt="Logo do Amazon Music">
        <p><a href="https://music.amazon.com" target="_blank">♬ Amazon Music</a></p>
    </div>
</body>
</html>
