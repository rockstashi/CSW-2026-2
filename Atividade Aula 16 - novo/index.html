<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color:white ;
        }
        a{
            color: blue;
        }
        a:hover{
            color: aquamarine;
        }


        .container {
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: center;
            gap: 5px;
            background-color: blue;
            height: 70px;
        }

        .item {
            background-color: yellow;
            border-radius: 15px;
            height: 50px;
            width: 50px;


        }

        .item-2 {
            background-color: yellow;
            border-radius: 15px;
            height: 50px;
            width: 50px;

        }

        .item-3 {
            background-color: yellow;
            border-radius: 15px;
            height: 50px;
            width: 50px;
        }

        .container-2 {
            display: flex;
            flex-direction: row;
            justify-content: end;
            align-items: center;
            gap: 5px;
            background-color: blue;
            height: 70px;
        }

        .item-4 {
            background-color: yellow;
            border-radius: 15px;
            height: 50px;
            width: 50px;


        }

        .item-5 {
            background-color: yellow;
            border-radius: 15px;
            height: 50px;
            width: 50px;

        }

        .item-6 {
            background-color: yellow;
            border-radius: 15px;
            height: 50px;
            width: 50px;
        }

        .frase-direita {
            text-align: right;

        }

        .container-3 {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 5px;
            background-color: blue;
            height: 70px;
        }

        .frase-centro {
            text-align: center;

        }

        .container-4 {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            background-color: blue;
            height: 70px;
        }

        .container-5 {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            gap: 5px;
            background-color: blue;
            height: 70px;
        }

        
    </style>
</head>

<body>
    <h1>Página 5</h1>
    <p><b>flex-start</b></p>
    <div class="container">
        <div class="item"></div>
        <div class="item-2"></div>
        <div class="item-3"></div>

    </div>


    <p class="frase-direita"><b>flex-end</b></p>

    <div class="container-2">
        <div class="item-4"></div>
        <div class="item-5"></div>
        <div class="item-6"></div>

    </div>


    <p class="frase-centro"><b>center</b></p>
    
    <div class="container-3">
        <div class="item-4"></div>
        <div class="item-5"></div>
        <div class="item-6"></div>

    </div>

    <p class="frase-centro">space-between</p>

    <div class="container-4">
        <div class="item-4"></div>
        <div class="item-5"></div>
        <div class="item-6"></div>

    </div>


    <p class="frase-centro">space-around</p>


    <div class="container-5">
        <div class="item-4"></div>
        <div class="item-5"></div>
        <div class="item-6"></div>

    </div>









</body>

</html>
